<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoSphere - Phase 2: Learning Management</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- MemoSphere design fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Bootstrap Supabase connection config (anon key is safe to ship publicly — it's gated by RLS).
         Seeds localStorage on first load so every browser/device works without manual console setup. -->
    <script>
        (function () {
            try {
                if (!localStorage.getItem('SUPABASE_URL')) {
                    localStorage.setItem('SUPABASE_URL', 'https://tbsnommacbbzbdkyumzg.supabase.co');
                }
                if (!localStorage.getItem('SUPABASE_ANON_KEY')) {
                    localStorage.setItem('SUPABASE_ANON_KEY', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRic25vbW1hY2JiemJka3l1bXpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNDE3NjYsImV4cCI6MjEwNjkxNzc2Nn0.ZYsW7Kwg5pIu1erWrkmi0wKNWvHOWvLyUE_kOvrVGGs');
                }
            } catch (e) {
                console.error('❌ Could not seed Supabase config into localStorage:', e);
            }
        })();
    </script>

    <!-- MemoSphere Supabase Utilities -->
    <script src="utils/supabase.js"></script>

    <style>
        [v-cloak] { display: none; }
        .tab-button { transition: all 0.3s ease; }
        .tab-button.active { border-bottom: 3px solid var(--ms-accent, #9333ea); color: var(--ms-accent, #9333ea); }
        .task-item { animation: slideIn 0.2s ease; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Vocabulary flashcard flip */
        .flashcard-flip-wrap { perspective: 1200px; }
        .flashcard-flip {
            position: relative; width: 100%; height: 180px;
            transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
            transform-style: preserve-3d;
        }
        .flashcard-flip.is-flipped { transform: rotateY(180deg); }
        .flashcard-face {
            position: absolute; inset: 0;
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 0.75rem; padding: 1.25rem; text-align: center;
        }
        .flashcard-face.back { transform: rotateY(180deg); }

        /* ===== MemoSphere design system (per-student tone) =====
           --ms-* tokens are the "chrome" — paper/surface/ink/accent — that varies by
           student. Subject colors (getSubjectColor/subjectIconMap) stay global on purpose:
           a subject looks the same no matter whose dashboard you're on; only the
           background "mood" changes. Default below is lilac (Isadora). Add more
           .tone-* blocks the same way when a new student needs a color. */
        :root{
            --ms-paper:#E6DEF0; --ms-surface:#F3EDFA; --ms-surface-raised:#FBF8FF;
            --ms-ink:#2A2630; --ms-ink-muted:#6B5F7D; --ms-line:#D1C0E3; --ms-line-strong:#B79FD1;
            --ms-accent:#5B3E8C; --ms-gold:#B8862E; --ms-moss:#46603C;
            --ms-font-display:'Zilla Slab', Georgia, serif;
            --ms-font-body:'IBM Plex Sans', system-ui, sans-serif;
        }
        .tone-lilac{ --ms-paper:#E6DEF0; --ms-surface:#F3EDFA; --ms-surface-raised:#FBF8FF; --ms-ink:#2A2630; --ms-ink-muted:#6B5F7D; --ms-line:#D1C0E3; --ms-line-strong:#B79FD1; --ms-accent:#5B3E8C; }
        .tone-blue{ --ms-paper:#DCE6F5; --ms-surface:#EEF3FC; --ms-surface-raised:#F8FAFF; --ms-ink:#1E2A38; --ms-ink-muted:#5C6B80; --ms-line:#B9CBE8; --ms-line-strong:#9CB6DE; --ms-accent:#2E5FA6; }
        .tone-pink{ --ms-paper:#F7DCE6; --ms-surface:#FCEEF3; --ms-surface-raised:#FFF8FA; --ms-ink:#3A2430; --ms-ink-muted:#80596B; --ms-line:#E8B9CE; --ms-line-strong:#DE9CB9; --ms-accent:#A6306B; }

        body{ font-family:var(--ms-font-body); background:var(--ms-paper); }
        .ms-font-display{ font-family:var(--ms-font-display); }
        .ms-card{ background:var(--ms-surface-raised); border:1px solid var(--ms-line); border-radius:6px; box-shadow:3px 3px 0 var(--ms-line); }
        .ms-panel{ background:var(--ms-surface); border:1px solid var(--ms-line); border-radius:6px; }
        .ms-accent-text{ color:var(--ms-accent); }
        .ms-ink{ color:var(--ms-ink); }
        .ms-ink-muted{ color:var(--ms-ink-muted); }
        .ms-active-pill{ background:var(--ms-accent); color:#fff; }
        .ms-input{ border:1px solid var(--ms-line); background:var(--ms-surface-raised); color:var(--ms-ink); }
        .ms-input:focus{ outline:2px solid var(--ms-accent); outline-offset:1px; }

        /* Renewed "ledger" look for subject-content panels, staged rollout: History first.
           Scoped under .ms-subject-renewed (applied only when the open subject is History)
           so Math/Biology/ELA/Electives panels are untouched for now. Targets the existing
           Tailwind color-utility classes as stable selector hooks rather than rewriting
           every template line. */
        .ms-subject-renewed .rounded-lg.border{ border-radius:6px; box-shadow:2px 2px 0 var(--ms-line); }
        .ms-subject-renewed .bg-slate-50, .ms-subject-renewed .bg-teal-50, .ms-subject-renewed .bg-orange-50,
        .ms-subject-renewed .bg-violet-50, .ms-subject-renewed .bg-amber-50, .ms-subject-renewed .bg-indigo-50,
        .ms-subject-renewed .bg-gray-50, .ms-subject-renewed .bg-white, .ms-subject-renewed .bg-gray-100 { background:var(--ms-surface-raised) !important; }
        .ms-subject-renewed .border-slate-200, .ms-subject-renewed .border-teal-200, .ms-subject-renewed .border-orange-200,
        .ms-subject-renewed .border-violet-200, .ms-subject-renewed .border-amber-300, .ms-subject-renewed .border-indigo-200,
        .ms-subject-renewed .border-gray-200, .ms-subject-renewed .border-gray-300 { border-color:var(--ms-line) !important; }
        .ms-subject-renewed p.font-semibold, .ms-subject-renewed label.font-semibold { font-family:var(--ms-font-display); }
        .ms-subject-renewed .text-slate-600, .ms-subject-renewed .text-slate-700,
        .ms-subject-renewed .text-teal-700, .ms-subject-renewed .text-teal-800,
        .ms-subject-renewed .text-orange-700, .ms-subject-renewed .text-violet-700,
        .ms-subject-renewed .text-amber-700, .ms-subject-renewed .text-indigo-700,
        .ms-subject-renewed .text-gray-700, .ms-subject-renewed .text-gray-800 { color:var(--ms-ink) !important; }
        .ms-subject-renewed .text-slate-500, .ms-subject-renewed .text-teal-600, .ms-subject-renewed .text-orange-600,
        .ms-subject-renewed .text-violet-600, .ms-subject-renewed .text-amber-600,
        .ms-subject-renewed .text-indigo-500, .ms-subject-renewed .text-indigo-600,
        .ms-subject-renewed .text-gray-400, .ms-subject-renewed .text-gray-500, .ms-subject-renewed .text-gray-600 { color:var(--ms-ink-muted) !important; }
        .ms-subject-renewed input, .ms-subject-renewed select, .ms-subject-renewed textarea{ background:var(--ms-surface-raised) !important; border-color:var(--ms-line) !important; color:var(--ms-ink) !important; border-radius:6px !important; }
        .ms-subject-renewed input:focus, .ms-subject-renewed select:focus, .ms-subject-renewed textarea:focus{ outline:2px solid var(--ms-accent); outline-offset:1px; }
        .ms-subject-renewed .bg-slate-500, .ms-subject-renewed .bg-orange-500, .ms-subject-renewed .bg-violet-600,
        .ms-subject-renewed .bg-indigo-500, .ms-subject-renewed .bg-indigo-600,
        .ms-subject-renewed .bg-amber-100, .ms-subject-renewed .bg-rose-100, .ms-subject-renewed .bg-blue-100, .ms-subject-renewed .bg-emerald-100 {
            background:var(--ms-accent) !important; color:#fff !important; border:none !important;
        }
        /* Folded-corner "dog-ear" card used for the History Core Curriculum grid */
        .ms-dogear{ position:relative; }
        .ms-dogear::before{ content:''; position:absolute; top:0; right:0; width:0; height:0; border-style:solid; border-width:0 18px 18px 0; border-color:transparent var(--ms-line-strong) transparent transparent; }
        .ms-dogear::after{ content:''; position:absolute; top:2px; right:2px; width:0; height:0; border-style:solid; border-width:0 14px 14px 0; border-color:transparent var(--ms-paper) transparent transparent; }
    </style>
</head>
<body>
    <div id="app" v-cloak :class="studentToneClass">
        <!-- Auth gate: login / sign up screen -->
        <div v-if="authChecked && !session" class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-sm">
                <h1 class="text-2xl font-bold text-purple-600 text-center mb-1">MemoSphere</h1>
                <p class="text-gray-500 text-sm text-center mb-6">{{ authMode === 'login' ? 'Sign in to continue' : 'Create the parent account' }}</p>

                <div v-if="authError" class="bg-red-50 border border-red-200 text-red-700 text-sm rounded px-3 py-2 mb-4">{{ authError }}</div>

                <form @submit.prevent="authMode === 'login' ? signIn() : signUp()">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input v-model="authEmail" type="email" required autocomplete="email"
                        class="w-full border border-gray-300 rounded px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-purple-400">

                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input v-model="authPassword" type="password" required
                        :autocomplete="authMode === 'login' ? 'current-password' : 'new-password'"
                        class="w-full border border-gray-300 rounded px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-purple-400">

                    <div v-if="authMode === 'signup'">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Confirm password</label>
                        <input v-model="authPassword2" type="password" required autocomplete="new-password"
                            class="w-full border border-gray-300 rounded px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-purple-400">
                    </div>

                    <button type="submit" :disabled="authLoading"
                        class="w-full bg-purple-600 hover:bg-purple-700 disabled:opacity-50 text-white font-medium rounded px-3 py-2 transition">
                        {{ authLoading ? 'Please wait…' : (authMode === 'login' ? 'Sign In' : 'Create Account') }}
                    </button>
                </form>

                <p v-if="authMode === 'login' && signupAllowed" class="text-center text-sm text-gray-500 mt-4">
                    First time here?
                    <button @click="authMode = 'signup'; authError = ''" class="text-purple-600 hover:underline">Create the parent account</button>
                </p>
                <p v-if="authMode === 'signup'" class="text-center text-sm text-gray-500 mt-4">
                    <button @click="authMode = 'login'; authError = ''" class="text-purple-600 hover:underline">Back to sign in</button>
                </p>
            </div>
        </div>

        <!-- Main app (only once authenticated) -->
        <template v-if="session">
        <!-- Header -->
        <header class="ms-card" style="border-radius:0; box-shadow:none; border-left:none; border-right:none; border-top:none;">
            <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center flex-wrap gap-4">
                    <div>
                        <h1 class="ms-font-display ms-accent-text" style="font-size:28px; font-weight:600;">MemoSphere</h1>
                        <p class="text-gray-600 text-sm mt-1">
                            Phase 2: Learning Management System
                            <span v-if="myProfile" class="ml-2 text-xs uppercase tracking-wide bg-gray-100 text-gray-500 rounded px-2 py-0.5">{{ myProfile.role }}</span>
                        </p>
                    </div>
                    <div class="flex items-center gap-4">
                        <select v-if="(isParent || isViewer) && students.length > 0" v-model="activeStudentId" @change="selectActiveStudent(activeStudentId)"
                            class="text-sm border border-gray-300 rounded px-2 py-1">
                            <option v-for="s in students" :key="s.id" :value="s.id">{{ s.display_name || s.email }}</option>
                        </select>
                        <span v-else-if="(isParent || isViewer) && students.length === 0" class="text-sm text-gray-400">No students yet</span>
                        <div v-if="studentGame" class="flex items-center gap-3 bg-purple-50 rounded-lg px-4 py-2 border border-purple-200">
                            <span class="text-sm">🐉 Lv.{{ studentGame.dragon_level }}</span>
                            <span class="text-sm">🪙 {{ studentGame.coins }}</span>
                            <span v-if="appConfig" class="text-sm text-gray-500">{{ appConfig.school_year }}</span>
                        </div>
                        <p class="text-sm text-green-600" v-if="isConnected">
                            <span class="inline-block w-2 h-2 bg-green-500 rounded-full mr-2"></span>Connected
                        </p>
                        <p class="text-sm text-yellow-600" v-else>
                            <span class="inline-block w-2 h-2 bg-yellow-500 rounded-full mr-2"></span>Connecting...
                        </p>
                        <button @click="signOut" class="text-sm text-gray-500 hover:text-gray-800 border border-gray-300 rounded px-3 py-1">Sign Out</button>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
            <!-- Tab Navigation -->
            <div class="ms-panel mb-0" style="border-radius:6px 6px 0 0; border-bottom:none;">
                <nav class="flex space-x-8 px-6 py-4 overflow-x-auto" aria-label="Tabs">
                    <button @click="currentTab = 'dashboard'" :class="['tab-button whitespace-nowrap px-3 py-2 text-sm font-medium', currentTab === 'dashboard' ? 'active' : 'text-gray-600 hover:text-gray-900']">📊 Dashboard</button>
                    <button @click="currentTab = 'planner'" :class="['tab-button whitespace-nowrap px-3 py-2 text-sm font-medium', currentTab === 'planner' ? 'active' : 'text-gray-600 hover:text-gray-900']">🗂️ Planner</button>
                    <button @click="currentTab = 'subjects'" :class="['tab-button whitespace-nowrap px-3 py-2 text-sm font-medium', currentTab === 'subjects' ? 'active' : 'text-gray-600 hover:text-gray-900']">📚 Subjects</button>
                    <button @click="currentTab = 'quizzes'" :class="['tab-button whitespace-nowrap px-3 py-2 text-sm font-medium', currentTab === 'quizzes' ? 'active' : 'text-gray-600 hover:text-gray-900']">🧠 Quizzes</button>
                    <button @click="currentTab = 'books'" :class="['tab-button whitespace-nowrap px-3 py-2 text-sm font-medium', currentTab === 'books' ? 'active' : 'text-gray-600 hover:text-gray-900']">📖 Books</button>
                    <button @click="currentTab = 'review'; computeReviewSession()" :class="['tab-button whitespace-nowrap px-3 py-2 text-sm font-medium', currentTab === 'review' ? 'active' : 'text-gray-600 hover:text-gray-900']">🔁 Review <span v-if="dueReviews.length" class="ml-1 bg-red-500 text-white text-xs rounded-full px-2">{{ dueReviews.length }}</span></button>
                    <button v-if="isParent" @click="currentTab = 'family'" :class="['tab-button whitespace-nowrap px-3 py-2 text-sm font-medium', currentTab === 'family' ? 'active' : 'text-gray-600 hover:text-gray-900']">👪 Family</button>
                </nav>
            </div>

            <div v-if="globalError" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mt-4">❌ {{ globalError }}</div>

            <!-- DASHBOARD -->
            <div v-if="currentTab === 'dashboard'" class="ms-panel p-8 mb-8" style="border-top:none; border-radius:0 0 6px 6px;">
                <p class="ms-ink-muted text-sm mb-6">Hello — here's the summary{{ activeStudent ? (' for ' + (activeStudent.display_name || activeStudent.email)) : '' }}.</p>

                <!-- Stat strip -->
                <div class="ms-card flex flex-col sm:flex-row mb-8" style="overflow:hidden;">
                    <div class="flex-1 p-5" style="border-left:3px solid var(--ms-accent);">
                        <p class="ms-ink-muted text-sm">Total Weeks</p>
                        <p class="ms-ink text-4xl font-bold mt-1">{{ weeks.length }}</p>
                    </div>
                    <div class="flex-1 p-5" style="border-left:3px solid var(--ms-moss);">
                        <p class="ms-ink-muted text-sm">Subjects This Week</p>
                        <p class="ms-ink text-4xl font-bold mt-1">{{ activeWeekSubjects.length }}</p>
                    </div>
                    <div class="flex-1 p-5" style="border-left:3px solid var(--ms-gold);">
                        <p class="ms-ink-muted text-sm">Hours This Week</p>
                        <p class="ms-ink text-4xl font-bold mt-1">{{ activeWeekHours }}</p>
                    </div>
                </div>

                <!-- Active week -->
                <div class="ms-card p-6 mb-6">
                    <div class="flex items-center justify-between flex-wrap gap-2 mb-1" style="border-bottom:1px solid var(--ms-line); padding-bottom:12px;">
                        <h3 class="ms-font-display ms-ink text-lg font-semibold">This Week</h3>
                        <span v-if="activeWeek" class="ms-ink-muted text-sm">Week {{ activeWeek.week_number }} · {{ formatDateUS(activeWeek.start_date) }}–{{ formatDateUS(activeWeek.end_date) }}</span>
                    </div>

                    <div v-if="!activeWeek" class="text-center py-8 ms-ink-muted text-sm">No active week. Mark a week "in progress" in the Subjects tab. ➡️</div>
                    <div v-else-if="activeWeekSubjects.length === 0" class="text-center py-8 ms-ink-muted text-sm">No subjects yet for this week. Add one in the Subjects tab! ➡️</div>

                    <div v-else>
                        <div v-for="subject in activeWeekSubjects" :key="subject.id" class="flex items-center gap-3 py-2.5" style="border-bottom:1px solid var(--ms-line);">
                            <span class="rounded-full flex items-center justify-center flex-shrink-0" :style="{ width:'30px', height:'30px', border:'1.5px solid '+getSubjectColor(subject) }">{{ getSubjectEmoji(subject) }}</span>
                            <div class="flex-1 min-w-0">
                                <p class="ms-ink font-medium truncate">{{ subject.subject_name }}<span v-if="subject.topic" class="ms-ink-muted font-normal"> — {{ subject.topic }}</span></p>
                            </div>
                            <span :class="statusBadgeClass(subject.status)">{{ statusLabel(subject.status) }}</span>
                            <span class="ms-ink-muted text-sm" style="min-width:40px; text-align:right;">{{ subject.time_spent_hours || 0 }}h</span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Academic Calendar -->
                    <div class="ms-card p-6">
                        <h3 class="ms-font-display ms-ink text-lg font-semibold mb-1">🗓️ Academic Calendar</h3>
                        <p class="ms-ink-muted text-sm mb-4">{{ academicCalendar.source }} — {{ academicCalendar.schoolYear }}</p>
                        <ul class="space-y-2">
                            <li v-for="d in upcomingKeyDates" :key="d.label" class="flex items-center justify-between text-sm" :class="d.isPast ? 'opacity-40' : ''">
                                <span class="ms-ink">{{ d.label }}</span>
                                <span class="flex items-center gap-2">
                                    <span class="ms-ink-muted">{{ formatDateRange(d.date, d.endDate) }}</span>
                                    <span v-if="!d.isPast" class="text-xs font-semibold px-2 py-0.5 rounded-full" :class="keyDateBadge(d) === 'Today' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'">{{ keyDateBadge(d) }}</span>
                                </span>
                            </li>
                        </ul>
                    </div>

                    <!-- Learning Periods -->
                    <div class="ms-card p-6">
                        <h3 class="ms-font-display ms-ink text-lg font-semibold mb-1">📘 Learning Periods (LP)</h3>
                        <p class="ms-ink-muted text-sm mb-4" v-if="currentLearningPeriod">Currently in LP {{ currentLearningPeriod.number }} of 10 ({{ formatDateRange(currentLearningPeriod.start, currentLearningPeriod.end) }})</p>
                        <p class="ms-ink-muted text-sm mb-4" v-else>No active Learning Period right now.</p>

                        <div class="flex flex-wrap gap-1.5 mb-5">
                            <span v-for="lp in academicCalendar.learningPeriods" :key="lp.number"
                                  class="text-xs font-semibold w-8 h-8 flex items-center justify-center rounded-full"
                                  :style="currentLearningPeriod && currentLearningPeriod.number === lp.number ? { background:'var(--ms-accent)', color:'#fff' } : (lp.end < todayISO ? { background:'var(--ms-line)', color:'var(--ms-ink-muted)' } : { background:'var(--ms-surface)', border:'1px solid var(--ms-line-strong)', color:'var(--ms-accent)' })"
                                  :title="formatDateRange(lp.start, lp.end)">{{ lp.number }}</span>
                        </div>

                        <h4 class="ms-ink text-sm font-semibold mb-2">LP Meetings (Semester 1)</h4>
                        <ul class="space-y-1.5">
                            <li v-for="m in academicCalendar.lpMeetings" :key="m.lp" class="flex items-center justify-between text-sm" :class="m.date < todayISO ? 'opacity-40' : ''">
                                <span class="ms-ink">LP{{ m.lp }} Meeting</span>
                                <span class="flex items-center gap-2">
                                    <span class="ms-ink-muted">{{ formatDateShort(m.date) }}, {{ m.time }}</span>
                                    <span v-if="nextLpMeeting && nextLpMeeting.lp === m.lp" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">Next</span>
                                </span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- PLANNER -->
            <div v-if="currentTab === 'planner'" class="ms-panel p-8" style="border-top:none; border-radius:0 0 6px 6px;">
                <h2 class="ms-font-display ms-ink text-xl font-semibold mb-6">Planner — Year Progress</h2>

                <div class="ms-card p-6 mb-6">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-semibold ms-ink">{{ yearProgressStats.completed }} of {{ yearProgressStats.total }} weeks completed</span>
                        <span class="text-2xl font-bold ms-accent-text">{{ yearProgressStats.pct }}%</span>
                    </div>
                    <div class="w-full rounded-full h-3" style="background:var(--ms-line);">
                        <div class="h-3 rounded-full transition-all" style="background:var(--ms-accent);" :style="{ width: yearProgressStats.pct + '%' }"></div>
                    </div>
                </div>

                <div v-if="weekProgressList.length === 0" class="text-center py-12 ms-panel ms-ink-muted">No weeks yet.</div>
                <div v-else class="space-y-2">
                    <div v-for="w in weekProgressList" :key="w.id" class="ms-card flex items-center gap-3 p-3 flex-wrap">
                        <span class="w-20 text-sm font-semibold ms-ink">Week {{ w.week_number }}</span>

                            <textarea :value="book.notes" @change="updateBookNotes(book, $event.target.value)" rows="2" placeholder="Notes / review..." class="w-full px-2 py-1 border border-gray-300 rounded text-sm"></textarea>

            <!-- REVIEW -->
            <div v-if="currentTab === 'review'" class="ms-panel p-8" style="border-top:none; border-radius:0 0 6px 6px;">
                <h2 class="ms-font-display ms-ink text-xl font-semibold mb-2">Spaced Review</h2>
                <p class="text-sm ms-ink-muted mb-6">Questions resurface here on a schedule: get one right and it comes back less often, get it wrong and it comes back tomorrow.</p>

                <div v-if="reviewSessionItems.length === 0" class="text-center py-12 ms-panel ms-ink-muted">
                    🎉 Nothing due right now. Take some quizzes in the Quizzes tab — answered questions will cycle back here for review.
                </div>

                <div v-else class="space-y-4">
                    <div v-for="item in reviewSessionItems" :key="item.question.id" class="ms-card p-4">
                        <p class="text-xs ms-ink-muted mb-1">{{ item.subjectName }} · {{ item.quiz.title }} · last seen {{ intervalLabel(item.lastAttempt.review_interval) }}</p>
                        <p class="font-semibold ms-ink mb-3">{{ item.question.question_text }}</p>

                        <div v-if="!reviewResult[item.question.id]">
                            <div v-for="(opt, oi) in item.question.options" :key="oi" class="flex items-center gap-2 mb-1">
                                <input type="radio" :name="'review' + item.question.id" :value="oi" v-model.number="reviewAnswers[item.question.id]" />
                                <label>{{ opt }}</label>

                            <button @click="submitReviewAnswer(item)" :disabled="reviewAnswers[item.question.id] === undefined" class="mt-2 disabled:bg-gray-300 text-white font-bold py-2 px-4 rounded-lg transition text-sm" style="background:var(--ms-accent);">

        <footer class="mt-12 py-8" style="border-top:1px solid var(--ms-line);">

                <p>MemoSphere v2.2 | Phase 2: Learning Management System</p>

        </template>
    </div>

    <script>
        const { createApp } = Vue;

        const defaultColors = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316'];
        const defaultEmojis = ['📚', '🔬', '📐', '📖', '🎨', '🎵', '🏃', '🌍'];
        const subjectIconMap = {
            'history': { emoji: '🏛️', color: '#3b82f6' },
            'history california': { emoji: '🌉', color: '#f59e0b' },
            'science': { emoji: '🔬', color: '#10b981' },
            'biology': { emoji: '🧬', color: '#10b981' },
            'ela': { emoji: '✏️', color: '#ef4444' },
            'math': { emoji: '📐', color: '#8b5cf6' },
            'electives': { emoji: '🎯', color: '#ec4899' }
        };
        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
            }
            return hash;
        }
        function getSubjectVisual(subjectName) {
            const key = (subjectName || '').trim().toLowerCase();
            if (subjectIconMap[key]) return subjectIconMap[key];
            const idx = hashString(key) % defaultEmojis.length;
            return { emoji: defaultEmojis[idx], color: defaultColors[idx] };
        }

        const app = createApp({
            data() {
                return {
                    session: null,
                    authChecked: false,
                    signupAllowed: false,
                    myProfile: null,
                    profiles: [],
                    activeStudentId: null,
                    studentGame: null,
                    newMember: { email: '', password: '', role: 'student', display_name: '' },
                    memberError: '',
                    memberLoading: false,
                    authMode: 'login',
                    authEmail: '',
                    authPassword: '',
                    authPassword2: '',
                    authError: '',
                    authLoading: false,
                    currentTab: 'dashboard',
                    isConnected: false,
                    appConfig: null,
                    weeks: [],
                    subjects: [],
                    selectedWeekId: null,
                    selectedWeekSubjectId: null,
                    selectedSchoolYear: null,
                    addWeekFormOpen: false,
                    showAddSubjectForm: false,
                    newWeek: { week_number: 1, start_date: '', end_date: '', school_year: '2026-2027', notes: '' },
                    newSubject: { subject_name: '', topic: '' },
                    subjectTemplates: [],
                    newTaskText: {},
                    sectionOpen: {},
                    notebookTab: {},
                    answerOpen: {},
                    flashcardReview: {},
                    bookLogFilterSubject: '',
                    bookDetailsOpen: {},
                    quizzes: [],
                    quizQuestions: [],
                    selectedSubjectId: null,
                    newQuiz: { title: '', quiz_type: 'retention' },
                    newQuestion: {},
                    takingQuiz: null,
                    takeAnswers: {},
                    quizResult: null,
                    books: [],
                    newBook: { title: '', author: '', total_pages: null, source: 'curriculum', subject_name: '', week_id: null },
                    quizAttempts: [],
                    reviewAnswers: {},
                    reviewResult: {},
                    reviewSessionItems: [],
                    isLoading: false,
                    error: null,
                    globalError: null,
                    successMessage: null,
                    academicCalendar: {
                        schoolYear: '2026-2027',
                        source: 'Sage Oak Charter Schools',
                        firstDay: '2026-08-24',
                        lastDay: '2027-06-04',
                        keyDates: [
                            { date: '2026-08-24', label: 'First Day of School' },
                            { date: '2026-09-07', label: 'Labor Day' },
                            { date: '2026-11-11', label: "Veteran's Day" },
                            { date: '2026-11-23', endDate: '2026-11-30', label: 'Fall Break' },
                            { date: '2026-11-26', endDate: '2026-11-27', label: 'Thanksgiving' },
                            { date: '2026-12-21', endDate: '2027-01-05', label: 'Winter Recess' },
                            { date: '2027-01-18', label: 'MLK Day' },
                            { date: '2027-01-22', label: 'End of 1st Semester' },
                            { date: '2027-02-12', label: 'Student Free Day' },
                            { date: '2027-02-15', label: "President's Day" },
                            { date: '2027-03-29', endDate: '2027-04-05', label: 'Spring Break' },
                            { date: '2027-05-31', label: 'Memorial Day' },
                            { date: '2027-06-04', label: 'Last Day of School' },
                            { date: '2027-06-18', label: 'Juneteenth (observed)' }
                        ],
                        learningPeriods: [
                            { number: 1, start: '2026-08-24', end: '2026-09-18' },
                            { number: 2, start: '2026-09-21', end: '2026-10-16' },
                            { number: 3, start: '2026-10-19', end: '2026-11-13' },
                            { number: 4, start: '2026-11-16', end: '2026-12-11' },
                            { number: 5, start: '2026-12-14', end: '2027-01-22' },
                            { number: 6, start: '2027-01-25', end: '2027-02-19' },
                            { number: 7, start: '2027-02-22', end: '2027-03-19' },
                            { number: 8, start: '2027-03-22', end: '2027-04-16' },
                            { number: 9, start: '2027-04-19', end: '2027-05-14' },
                            { number: 10, start: '2027-05-17', end: '2027-06-04' }
                        ],
                        lpMeetings: [
                            { lp: 1, date: '2026-09-23', time: '12:30 PM' },
                            { lp: 2, date: '2026-10-21', time: '12:30 PM' },
                            { lp: 3, date: '2026-11-18', time: '12:30 PM' },
                            { lp: 4, date: '2026-12-16', time: '12:30 PM' }
                        ]
                    }
                };
            },
            computed: {
                isParent() { return !!this.myProfile && this.myProfile.role === 'parent'; },
                isStudent() { return !!this.myProfile && this.myProfile.role === 'student'; },
                isViewer() { return !!this.myProfile && this.myProfile.role === 'viewer'; },
                // Edit access to curriculum/content definitions (weeks, subject structure,
                // labs/cards/resources definitions, quizzes). Students & viewers get
                // read + the specific student actions (checkboxes, book log, quizzes, dragon).
                canEditContent() { return this.isParent; },
                students() { return (this.profiles || []).filter(p => p.role === 'student'); },
                activeStudent() { return (this.profiles || []).find(p => p.id === this.activeStudentId) || null; },
                // Per-student background tone: first student (by creation order, i.e. array
                // order from profiles) gets lilac, second blue, third pink, then it repeats.
                // Add a 4th tone class in <style> and in this array if that ever happens.
                studentToneClass() {
                    const tones = ['tone-lilac', 'tone-blue', 'tone-pink'];
                    const idx = this.students.findIndex(s => s.id === this.activeStudentId);
                    return tones[idx >= 0 ? idx % tones.length : 0];
                },
                // subjects/books scoped to whichever student is currently being viewed.
                // For a student account this is always their own id (RLS also enforces this
                // server-side); for parent/viewer it's whichever student is picked in the header.
                scopedSubjects() {
                    if (!this.activeStudentId) return [];
                    return (this.subjects || []).filter(s => s.student_id === this.activeStudentId);
                },
                scopedBooksRaw() {
                    if (!this.activeStudentId) return [];
                    return (this.books || []).filter(b => b.student_id === this.activeStudentId);
                },
                visibleBooks() {
                    let list = (this.scopedBooksRaw || []).filter(b => b.visible !== false);
                    if (this.bookLogFilterSubject) list = list.filter(b => (b.subject_name || '') === this.bookLogFilterSubject);
                    return list.slice().sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
                },
                bookSubjectOptions() {
                    const set = new Set((this.books || []).map(b => b.subject_name).filter(Boolean));
                    return Array.from(set).sort();
                },
                activeWeek() {
                    return this.weeks.find(w => w.status === 'in_progress') || null;
                },
                activeWeekSubjects() {
                    if (!this.activeWeek) return [];
                    return this.scopedSubjects.filter(s => s.week_id === this.activeWeek.id);
                },
                activeWeekHours() {
                    return this.activeWeekSubjects.reduce((sum, s) => sum + (Number(s.time_spent_hours) || 0), 0);
                },
                todayISO() {
                    const d = new Date();
                    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                },
                currentLearningPeriod() {
                    const today = this.todayISO;
                    return this.academicCalendar.learningPeriods.find(lp => today >= lp.start && today <= lp.end) || null;
                },
                upcomingKeyDates() {
                    const today = this.todayISO;
                    return this.academicCalendar.keyDates
                        .map(d => ({ ...d, sortDate: d.endDate || d.date, isPast: (d.endDate || d.date) < today }))
                        .sort((a, b) => a.date.localeCompare(b.date));
                },
                nextLpMeeting() {
                    const today = this.todayISO;
                    return this.academicCalendar.lpMeetings.find(m => m.date >= today) || null;
                },
                yearProgressStats() {
                    const realWeeks = this.weeksForSelectedYear.filter(w => w.week_number < 900);
                    const total = realWeeks.length;
                    const completed = realWeeks.filter(w => w.status === 'completed').length;
                    const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
                    return { total, completed, pct };
                },
                // --- Multi school-year support: weeks never get re-numbered (week_number keeps
                // climbing forever across years), but the Planner's week-pill list and progress
                // stats are scoped to one school year at a time so old years don't pile up in one
                // endless unlabeled row, and the parent can actually switch back to review a past year.
                schoolYears() {
                    const set = new Set(this.weeks.map(w => w.school_year).filter(Boolean));
                    if (this.appConfig && this.appConfig.school_year) set.add(this.appConfig.school_year);
                    return Array.from(set).sort();
                },
                weeksForSelectedYear() {
                    if (!this.selectedSchoolYear) return this.weeks;
                    return this.weeks.filter(w => w.school_year === this.selectedSchoolYear);
                },
                weekProgressList() {
                    return this.weeks
                        .filter(w => w.week_number < 900)
                        .slice()
                        .sort((a, b) => a.week_number - b.week_number)
                        .map(w => {
                            const subs = this.scopedSubjects.filter(s => s.week_id === w.id);
                            const completedSubs = subs.filter(s => s.status === 'completed').length;
                            const pct = subs.length > 0 ? Math.round((completedSubs / subs.length) * 100) : 0;
                            return { ...w, subjectsTotal: subs.length, subjectsCompleted: completedSubs, pct };
                        });
                },
                selectedWeek() {
                    return this.weeks.find(w => w.id === this.selectedWeekId) || null;
                },
                subjectsForSelectedWeek() {
                    if (!this.selectedWeekId) return [];
                    const list = this.scopedSubjects.filter(s => s.week_id === this.selectedWeekId);
                    // Standard tab order regardless of the order subjects were created/fetched in,
                    // so tabs don't shuffle week to week. Electives always last; anything unrecognized
                    // (e.g. "LP / Tutor") sits after the core subjects but still before Electives.
                    const kindOrder = { history: 0, math: 1, ela: 2, biology: 3 };
                    const rank = (s) => {
                        const kind = this.subjectKind(s);
                        if (kind === 'electives') return 99;
                        return kindOrder[kind] !== undefined ? kindOrder[kind] : 50;
                    };
                    return list.slice().sort((a, b) => rank(a) - rank(b));
                },
                currentWeekSubject() {
                    const list = this.subjectsForSelectedWeek;
                    if (list.length === 0) return null;
                    return list.find(s => s.id === this.selectedWeekSubjectId) || list[0];
                },
                activeNotebookTabLabel() {
                    if (!this.currentWeekSubject) return '';
                    const key = this.activeNotebookTab(this.currentWeekSubject.id);
                    const tab = this.notebookTabsFor(this.currentWeekSubject).find(t => t.key === key);
                    return tab ? tab.label.replace(/^The /, '') : '';
                },
                subjectPickerOptions() {
                    return this.scopedSubjects.map(s => {
                        const week = this.weeks.find(w => w.id === s.week_id);
                        const weekLabel = week ? `Week ${week.week_number}` : 'Unknown week';
                        return { id: s.id, label: `${weekLabel} — ${s.subject_name}` };
                    });
                },
                quizzesForSelectedSubject() {
                    if (!this.selectedSubjectId) return [];
                    return this.quizzes.filter(q => q.subject_id === this.selectedSubjectId);
                },
                dueReviews() {
                    const now = Date.now();
                    const byQuestion = {};
                    for (const a of this.quizAttempts) {
                        const existing = byQuestion[a.question_id];
                        if (!existing || new Date(a.created_at) > new Date(existing.created_at)) {
                            byQuestion[a.question_id] = a;
                        }
                    }
                    const due = [];
                    for (const questionId of Object.keys(byQuestion)) {
                        const lastAttempt = byQuestion[questionId];
                        const question = this.quizQuestions.find(q => q.id === Number(questionId));
                        if (!question) continue;
                        const dueAt = new Date(lastAttempt.created_at).getTime() + this.intervalDays(lastAttempt.review_interval) * 86400000;
                        if (now < dueAt) continue;
                        const quiz = this.quizzes.find(q => q.id === question.quiz_id);
                        if (!quiz) continue;
                        const subject = this.subjects.find(s => s.id === quiz.subject_id);
                        due.push({ question, quiz, lastAttempt, subjectName: subject ? subject.subject_name : (quiz.subject_name || 'Subject') });
                    }
                    return due;
                }
            },
            async mounted() {
                console.log('🚀 MemoSphere Phase 2: Loading...');

                // Auth gate: nothing below loads until there's a logged-in session.
                this.session = await window.MemoSphereSupabase.authGetSession();
                window.MemoSphereSupabase.authOnChange((session) => {
                    const hadSession = !!this.session;
                    this.session = session;
                    if (session && !hadSession) {
                        // just signed in — load the app data
                        this.loadAppAfterAuth();
                    }
                    if (!session) {
                        // signed out — clear in-memory data
                        this.isConnected = false;
                    }
                });
                if (!this.session) {
                    this.signupAllowed = !(await window.MemoSphereSupabase.anyProfilesExist());
                }
                this.authChecked = true;

                if (this.session) {
                    await this.loadAppAfterAuth();
                }
            },
            methods: {
                async loadAppAfterAuth() {
                  try {
                    const testResult = await window.MemoSphereSupabase.testConnection();
                    this.isConnected = testResult;

                    if (testResult) {
                        this.myProfile = await window.MemoSphereSupabase.getMyProfile();
                        if (this.myProfile && this.myProfile.role === 'student') {
                            this.activeStudentId = this.myProfile.id;
                        }

                        await Promise.all([this.loadAppConfig(), this.loadWeeks(), this.loadSubjects(), this.loadQuizzes(), this.loadQuizQuestions(), this.loadBooks(), this.loadQuizAttempts(), this.loadSubjectTemplates()]);

                        if (this.myProfile && (this.myProfile.role === 'parent' || this.myProfile.role === 'viewer')) {
                            await this.loadProfiles();
                            if (!this.activeStudentId && this.students.length > 0) {
                                this.activeStudentId = this.students[0].id;
                            }
                        }
                        await this.loadStudentGame();

                        if (this.activeWeek) {
                            this.selectedWeekId = this.activeWeek.id;
                            this.selectedSchoolYear = this.activeWeek.school_year || null;
                        } else if (this.weeks.length > 0) {
                            const last = this.weeks[this.weeks.length - 1];
                            this.selectedSchoolYear = last.school_year || null;
                            const list = this.weeksForSelectedYear;
                            this.selectedWeekId = list[list.length - 1] ? list[list.length - 1].id : this.weeks[0].id;
                        } else if (this.appConfig && this.appConfig.school_year) {
                            this.selectedSchoolYear = this.appConfig.school_year;
                        }
                        if (this.scopedSubjects.length > 0) {
                            this.selectedSubjectId = this.scopedSubjects[0].id;
                        }
                        this.quizzes.forEach(q => this.ensureNewQuestionSlot(q.id));
                        this.computeReviewSession();
                        const realWeeks = this.weeks.filter(w => w.week_number < 900);

                // --- Which subject-specific layout to use, and which generic sections apply ---
                subjectKind(subject) {

                    if (name.includes('math')) return 'math';
                    if (name.includes('biology') || name.includes('science')) return 'biology';
                    if (name.includes('history')) return 'history';
                    if (name.includes('ela') || name.includes('english') || name.includes('language arts')) return 'ela';
                    return 'generic';
                },
                sectionVisible(subject, key) {
                    const rules = {
                        math:      { enrichment: false, study_memos: false, labs: false, hands_on: false, notebook: false, quizzes: false, vocabulary: false },
                        electives: { enrichment: false, study_memos: false, labs: false, hands_on: false, notebook: false, quizzes: false, vocabulary: false },
                        biology:   { enrichment: true,  study_memos: true,  labs: true,  hands_on: false, notebook: true,  quizzes: true,  vocabulary: false },
                        history:   { enrichment: true,  study_memos: true,  labs: false, hands_on: true,  notebook: true,  quizzes: true,  vocabulary: false },
                        ela:       { enrichment: true,  study_memos: true,  labs: false, hands_on: false, notebook: false, quizzes: true,  vocabulary: true },
                        generic:   { enrichment: true,  study_memos: true,  labs: true,  hands_on: true,  notebook: true,  quizzes: true,  vocabulary: false }
                    };
                    const kind = this.subjectKind(subject);

                elaSegmentDefaults() {

                        { key: 'writing', title: '✍️ Writing', done: false, program: '', unit_lesson: '', style_focus: '', extra: [] },
                        { key: 'grammar', title: '🔤 Grammar and Mechanics', done: false, program: '', unit_lesson: '', grammar_notes: '', extra: [] },
                        { key: 'spelling', title: '🔡 Spelling and Vocabulary', done: false, program: '', lesson_rule: '', test_score: '', extra: [] }

                getElaSegments(subject) {
                    const raw = subject.core_curriculum;

                    const defaults = this.elaSegmentDefaults();
                    if (!saved) return defaults;

                getActivityEntries(subject) {

                getSubjectColor(subject) { return getSubjectVisual(typeof subject === 'string' ? subject : subject.subject_name).color; },
                getSubjectEmoji(subject) { return getSubjectVisual(typeof subject === 'string' ? subject : subject.subject_name).emoji; },
                statusLabel(status) {
                    return { not_started: 'Not Started', in_progress: 'In Progress', completed: 'Completed' }[status] || status;
                },
                statusBadgeClass(status) {
                    const base = 'text-xs font-semibold px-2 py-1 rounded-full ml-2';
                    if (status === 'completed') return base + ' bg-green-100 text-green-700';
                    if (status === 'in_progress') return base + ' bg-blue-100 text-blue-700';
                    return base + ' bg-gray-100 text-gray-600';
                },
                formatDateShort(dateStr) {
                    if (!dateStr) return '';
                    const [y, m, d] = dateStr.split('-').map(Number);
                    const dt = new Date(y, m - 1, d);
                    return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                },
                formatDateUS(dateStr) {
                    if (!dateStr) return '';
                    const [y, m, d] = dateStr.split('-').map(Number);
                    return `${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}/${y}`;
                },
                formatDateRange(dateStr, endDateStr) {
                    if (!endDateStr || endDateStr === dateStr) return this.formatDateShort(dateStr);
                    return `${this.formatDateShort(dateStr)} – ${this.formatDateShort(endDateStr)}`;
                },
                daysUntil(dateStr) {
                    const [y, m, d] = dateStr.split('-').map(Number);
                    const target = new Date(y, m - 1, d);
                    const now = new Date();
                    const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    return Math.round((target - todayMid) / 86400000);
                },
                keyDateBadge(d) {
                    const days = this.daysUntil(d.sortDate);
                    if (days < 0) return 'Past';
                    if (days === 0) return 'Today';
                    return `in ${days}d`;
                },
                async loadQuizzes() {

                async loadQuizQuestions() {

                    this.quizQuestions = (data || []).sort((a, b) => (a.question_number || 0) - (b.question_number || 0));
                },
                getQuestions(quizId) {
                    return this.quizQuestions.filter(q => q.quiz_id === quizId);
                },
                ensureNewQuestionSlot(quizId) {
                    if (!this.newQuestion[quizId]) {
                        this.newQuestion[quizId] = { question_text: '', options: ['', '', '', ''], correct_option_index: 0, explanation: '' };
                    }
                },
                quizzesForSubject(subject) {

                goTakeQuiz(subject, quiz) {

                async addQuizForSubject(subject) {
                    if (!this.newQuiz.title.trim()) {
                        this.error = 'Enter a quiz title';
                        return;

                    this.isLoading = true;
                    this.error = null;
                    try {

                            week_id: subject.week_id,
                            title: this.newQuiz.title,
                            quiz_type: this.newQuiz.quiz_type,
                            subject_name: subject.subject_name
                        });
                        if (result && result[0]) {
                            this.quizzes.push(result[0]);
                            this.ensureNewQuestionSlot(result[0].id);
                            this.successMessage = `✨ Quiz "${result[0].title}" created!`;

                async addQuiz() {
                    if (!this.newQuiz.title.trim()) {
                        this.error = 'Enter a quiz title';
                        return;
                    }
                    if (!this.selectedSubjectId) {
                        this.error = 'Select a subject first';
                        return;
                    }
                    const subject = this.subjects.find(s => s.id === this.selectedSubjectId);
                    this.isLoading = true;
                    this.error = null;
                    try {

                            week_id: subject ? subject.week_id : null,
                            title: this.newQuiz.title,

                        this.isLoading = false;

                async deleteQuiz(id) {
                    if (!confirm('Delete this quiz and its questions?')) return;
                    try {
                        await window.MemoSphereSupabase.deleteWhere('quiz_attempts', 'quiz_id', id);
                        const qIds = this.getQuestions(id).map(q => q.id);
                        for (const qid of qIds) {

                        }
                        await window.MemoSphereSupabase.deleteRow('quizzes', id);
                        this.quizzes = this.quizzes.filter(q => q.id !== id);
                        this.quizQuestions = this.quizQuestions.filter(q => q.quiz_id !== id);
                    } catch (err) {
                        this.globalError = err.message || 'Failed to delete quiz';
                    }
                },
                async addQuestion(quiz) {
                    this.ensureNewQuestionSlot(quiz.id);
                    const nq = this.newQuestion[quiz.id];
                    if (!nq.question_text.trim() || nq.options.some(o => !o.trim())) {
                        this.error = 'Fill in the question and all 4 options';
                        return;
                    }
                    try {
                        const nextNumber = this.getQuestions(quiz.id).length + 1;
                        const result = await window.MemoSphereSupabase.insertRow('quiz_questions', {
                            quiz_id: quiz.id,
                            question_text: nq.question_text,
                            question_number: nextNumber,
                            options: nq.options,
                            correct_option_index: nq.correct_option_index,
                            explanation: nq.explanation || null
                        });
                        if (result && result[0]) {
                            this.quizQuestions.push(result[0]);
                            this.newQuestion[quiz.id] = { question_text: '', options: ['', '', '', ''], correct_option_index: 0, explanation: '' };

                async deleteQuestion(quizId, questionId) {

                        await window.MemoSphereSupabase.deleteRow('quiz_questions', questionId);
                        this.quizQuestions = this.quizQuestions.filter(q => q.id !== questionId);
                    } catch (err) {
                        this.globalError = err.message || 'Failed to delete question';

                startQuiz(quiz) {
                    this.takingQuiz = quiz;
                    this.takeAnswers = {};

                cancelQuiz() {
                    this.takingQuiz = null;
                    this.takeAnswers = {};
                    this.quizResult = null;
                },
                async finishQuiz() {
                    const questions = this.getQuestions(this.takingQuiz.id);
                    let correct = 0;
                    try {
                        for (const q of questions) {
                            const given = this.takeAnswers[q.id];
                            const isCorrect = given === q.correct_option_index;
                            if (isCorrect) correct++;
                            const attemptResult = await window.MemoSphereSupabase.insertRow('quiz_attempts', {
                                quiz_id: this.takingQuiz.id,
                                question_id: q.id,
                                user_email: (this.myProfile && this.myProfile.email) || (this.session && this.session.user && this.session.user.email),
                                answer_given: given,
                                is_correct: isCorrect,
                                review_interval: isCorrect ? 'weekly' : 'daily',
                                attempt_number: 1
                            });
                            if (attemptResult && attemptResult[0]) this.quizAttempts.push(attemptResult[0]);
                        }

                        const coinsEarned = correct * 10;
                        const subject = this.subjects.find(s => s.id === this.selectedSubjectId);
                        if (subject) {
                            const newCorrect = (subject.correct_answers || 0) + correct;
                            const newStars = (subject.stars_earned || 0) + (correct === questions.length ? 1 : 0);
                            await window.MemoSphereSupabase.updateRow('subjects', subject.id, {
                                correct_answers: newCorrect,
                                stars_earned: newStars
                            });
                            subject.correct_answers = newCorrect;
                            subject.stars_earned = newStars;
                        }
                        if (this.studentGame) {
                            const newCoins = (this.studentGame.coins || 0) + coinsEarned;
                            const newLevel = Math.floor(newCoins / 100);
                            await window.MemoSphereSupabase.updateRowBy('student_game', 'student_id', this.studentGame.student_id, {
                                coins: newCoins,
                                dragon_level: newLevel
                            });
                            this.studentGame.coins = newCoins;
                            this.studentGame.dragon_level = newLevel;
                        }

                        this.quizResult = { correct, total: questions.length, coinsEarned };
                    } catch (err) {
                        console.error('Error finishing quiz:', err);
                        this.globalError = err.message || 'Failed to record quiz results';
                    }
                },
                async loadBooks() {

                },
                async loadSubjectTemplates() {

                },
                // Keeps the persistent per-subject resource template in sync whenever that resource
                // field is edited on any week's subject, so the next week created picks up the latest content.
                async syncFieldToTemplate(subjectName, field, data) {
                    if (!subjectName) return;
                    try {
                        const result = await window.MemoSphereSupabase.upsertRow('subject_templates', 'subject_name', subjectName, {
                            [field]: data,
                            updated_at: new Date().toISOString()
                        });
                        if (result && result[0]) {
                            const idx = this.subjectTemplates.findIndex(t => t.id === result[0].id);
                            if (idx === -1) this.subjectTemplates.push(result[0]);
                            else this.subjectTemplates[idx] = result[0];
                        }
                    } catch (err) {
                        console.error('Failed to sync subject template:', err);
                    }
                },
                // Creates one subject per known template for the selected week, skipping subject names
                // already present in that week, pre-filled with each template's latest resource content.
                async loadWeekFromTemplates() {
                    if (!this.selectedWeekId) {
                        this.error = 'Select a week first';
                        return;
                    }
                    const existingNames = this.subjectsForSelectedWeek.map(s => (s.subject_name || '').trim().toLowerCase());
                    const toCreate = this.subjectTemplates.filter(t => !existingNames.includes((t.subject_name || '').trim().toLowerCase()));
                    if (toCreate.length === 0) {
                        this.successMessage = 'This week already has all template subjects.';
                        setTimeout(() => this.successMessage = null, 3000);
                        return;
                    }
                    this.isLoading = true;
                    try {
                        for (const t of toCreate) {
                            const result = await window.MemoSphereSupabase.insertRow('subjects', {
                                week_id: this.selectedWeekId,
                                subject_name: t.subject_name,
                                topic: null,
                                status: 'not_started',
                                tasks: { tasks: [] },
                                core_curriculum: t.core_curriculum || { fields: [] },
                                enrichment_resources: t.enrichment_resources || { entries: [] },
                                vocabulary_cards: t.vocabulary_cards || { entries: [] },
                                hands_on_activities: t.hands_on_activities || { entries: [] },
                                labs: t.labs || { entries: [] },
                                notebook_content: t.notebook_content || {},
                                study_memos: {},
                                custom_cards: t.custom_cards || { entries: [] }
                            });
                            if (result && result[0]) this.subjects.push(result[0]);
                        }
                        this.successMessage = `✨ ${toCreate.length} subject(s) loaded from templates!`;
                        setTimeout(() => this.successMessage = null, 3000);
                    } catch (err) {
                        this.error = err.message || 'Failed to load subjects from templates';
                    } finally {
                        this.isLoading = false;
                    }
                },
                async addBook() {
                    if (!this.newBook.title.trim()) {
                        this.error = 'Enter a book title';
                        return;
                    }
                    if (!this.activeStudentId) {
                        this.error = 'No student selected.';
                        return;
                    }
                    this.isLoading = true;
                    this.error = null;
                    try {
                        const result = await window.MemoSphereSupabase.insertRow('books', {
                            title: this.newBook.title,
                            author: this.newBook.author || null,
                            total_pages: this.newBook.total_pages || null,
                            source: this.newBook.source,
                            subject_name: this.newBook.subject_name || null,
                            week_id: this.newBook.week_id || null,
                            student_id: this.activeStudentId,
                            reading_status: 'reading',
                            pages_read: 0
                        });
                        if (result && result[0]) {
                            this.books.unshift(result[0]);
                            this.successMessage = `✨ "${result[0].title}" added!`;
                            this.newBook = { title: '', author: '', total_pages: null, source: 'curriculum', subject_name: '', week_id: null };
                            setTimeout(() => this.successMessage = null, 3000);
                        } else {
                            this.error = 'Failed to add book';
                        }
                    } catch (err) {
                        console.error('Error adding book:', err);
                        this.error = err.message || 'Failed to add book';
                    } finally {
                        this.isLoading = false;
                    }
                },
                async setBookStatus(book, status) {
                    try {
                        await window.MemoSphereSupabase.updateRow('books', book.id, { reading_status: status });
                        book.reading_status = status;
                    } catch (err) {
                        this.globalError = err.message || 'Failed to update reading status';
                    }
                },
                async updateBookPages(book, pages) {
                    const pagesRead = Number(pages);
                    try {
                        const updates = { pages_read: pagesRead };
                        if (book.total_pages && pagesRead >= book.total_pages) {
                            updates.reading_status = 'completed';
                        }
                        await window.MemoSphereSupabase.updateRow('books', book.id, updates);
                        book.pages_read = pagesRead;
                        if (updates.reading_status) book.reading_status = updates.reading_status;
                    } catch (err) {
                        this.globalError = err.message || 'Failed to update pages read';
                    }
                },
                async setBookRating(book, rating) {
                    try {
                        await window.MemoSphereSupabase.updateRow('books', book.id, { rating });
                        book.rating = rating;
                    } catch (err) {
                        this.globalError = err.message || 'Failed to update rating';
                    }
                },
                async deleteBook(id) {
                    if (!confirm('Delete this book?')) return;
                    try {
                        await window.MemoSphereSupabase.deleteRow('books', id);
                        this.books = this.books.filter(b => b.id !== id);
                    } catch (err) {
                        this.globalError = err.message || 'Failed to delete book';
                    }
                },
                async updateBookNotes(book, notes) {
                    try {
                        await window.MemoSphereSupabase.updateRow('books', book.id, { notes });
                        book.notes = notes;
                    } catch (err) {
                        this.globalError = err.message || 'Failed to update notes';
                    }
                },
                toggleBookDetails(id) {
                    this.bookDetailsOpen[id] = !this.bookDetailsOpen[id];
                },
                isBookDetailsOpen(id) {
                    return !!this.bookDetailsOpen[id];
                },
                async loadQuizAttempts() {
                    const data = await window.MemoSphereSupabase.getAllRows('quiz_attempts');
                    this.quizAttempts = data || [];
                },
                computeReviewSession() {
                    this.reviewSessionItems = this.dueReviews;
                    this.reviewAnswers = {};
                    this.reviewResult = {};
                },
                intervalDays(interval) {
                    return { daily: 1, weekly: 7, biweekly: 14, monthly: 30 }[interval] || 7;
                },
                intervalLabel(interval) {
                    return { daily: 'Daily', weekly: 'Weekly', biweekly: 'Biweekly', monthly: 'Monthly' }[interval] || interval;
                },
                nextInterval(current, correct) {
                    const order = ['daily', 'weekly', 'biweekly', 'monthly'];
                    if (!correct) return 'daily';
                    const idx = order.indexOf(current);
                    return order[Math.min(idx + 1, order.length - 1)] || 'weekly';
                },
                async submitReviewAnswer(item) {
                    const given = this.reviewAnswers[item.question.id];
                    if (given === undefined) return;
                    const isCorrect = given === item.question.correct_option_index;
                    const nextInt = this.nextInterval(item.lastAttempt.review_interval, isCorrect);
                    try {
                        const result = await window.MemoSphereSupabase.insertRow('quiz_attempts', {
                            quiz_id: item.quiz.id,
                            question_id: item.question.id,
                            user_email: 'cgchen.usa@gmail.com',
                            answer_given: given,
                            is_correct: isCorrect,
                            review_interval: nextInt,
                            attempt_number: (item.lastAttempt.attempt_number || 1) + 1
                        });
                        if (result && result[0]) this.quizAttempts.push(result[0]);
                        this.reviewResult[item.question.id] = { correct: isCorrect, nextInterval: nextInt };
                        if (isCorrect) {
                            const subject = this.subjects.find(s => s.id === item.quiz.subject_id);
                            if (subject) {
                                const newCorrect = (subject.correct_answers || 0) + 1;
                                await window.MemoSphereSupabase.updateRow('subjects', subject.id, { correct_answers: newCorrect });
                                subject.correct_answers = newCorrect;
                            }
                        }
                    } catch (err) {
                        this.globalError = err.message || 'Failed to record review answer';
                    }
                }
            }
        });

        app.mount('#app');
    </script>
</body>
</html>
